# Happy Hare MMU includes (should be near top of file)
[include mmu/base/*.cfg]
[include mmu/macros/*.cfg]
## Voron Design VORON2 300mm SKR 1.4 TMC2209 UART config 
## Voron 1.524

[include mainsail.cfg]

#[include macros/emu_macros.cfg]

#[include lcd_tweaks.cfg]
#[include nozzle_scrub.cfg]
#[include custom_gcode.cfg]
#[include air_filter.cfg]
[include macros/stealthburner_leds.cfg]
[include macros/macros.cfg]
[include macros/movement.cfg]
[include macros/TEST_SPEED.cfg]
#[include config_backup.cfg]

# Happy Hare Client macros (should be after last include or other PAUSE/CANCEL macros)
[include mmu/optional/client_macros.cfg]
[include goose_purge.cfg]
[include macros/squiggly_purge.cfg]

[exclude_object]


##########################################################################################################################################
[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
canbus_uuid: 763bc5d7638d


[cartographer]
mcu: cartographer
x_offset: 0                          
#    adjust for your cartographers offset from nozzle to middle of coil
y_offset: 21      
verbose: yes


##########################################################################################################################################


[mcu toolhead]
##--------------------------------------------------------------------
canbus_uuid: 08d6028a0281
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_280042000C50425539393020-if00
##--------------------------------------------------------------------


[mcu]
##	MCU for X/Y/E steppers main MCU
##	[X in X] - B Motor
##	[Y in Y] - A Motor
##	[E in E0] - Extruder
##	Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_lpc1769_0B50FF0CA69869AFD53E415EC72000F5-if00
##--------------------------------------------------------------------

[mcu z]
##	MCU for Z steppers
##	[Z in X] - Front Left
##	[Z1 in Y] - Rear Left
##	[Z2 in Z] - Rear Right
##	[Z3 in E0]- Front Right
##	Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_lpc1769_17800007A49869AF9AE53E5EC72000F5-if00
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000    			
max_z_velocity: 25
max_z_accel: 350
square_corner_velocity: 5.0


##########################################################################################################################################
# 	X/Y Stepper Settings
##########################################################################################################################################

[stepper_x]
##	Connected to X on mcu_xye (B Motor)
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: toolhead:PB8
position_min: 0
##--------------------------------------------------------------------

##	Uncomment for 300mm build
position_endstop: 296
position_max: 296

##--------------------------------------------------------------------
homing_speed: 50   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: P1.10
interpolate: True
run_current: 0.8
#hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
##	Connected to Y on mcu_xye (A Motor)
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: P1.28
position_min: 0
##--------------------------------------------------------------------

##	Uncomment for 300mm build
position_endstop: 305
position_max: 305

##--------------------------------------------------------------------
homing_speed: 50  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: P1.9
interpolate: True
run_current: 0.8
#hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
 
##########################################################################################################################################
# 	Z Stepper Settings
##########################################################################################################################################

## Z MCU - In X Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: z:P2.2
dir_pin: !z:P2.6
enable_pin: !z:P2.1
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop

##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
##--------------------------------------------------------------------

##	Uncomment below for 300mm build
position_max: 270

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0   # cartographer needs this to be set to 0

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: z:P1.10
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z MCU - In Y Position
##	Z1 Stepper - Rear Left
[stepper_z1]
step_pin: z:P0.19
dir_pin: z:P0.20
enable_pin: !z:P2.8
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: z:P1.9
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z MCU - In Z Position
##	Z2 Stepper - Rear Right
[stepper_z2]
step_pin: z:P0.22
dir_pin: !z:P2.11
enable_pin: !z:P0.21
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: z:P1.8
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z MCU - In E0 Position
##	Z3 Stepper - Front Right
[stepper_z3]
step_pin: z:P2.13
dir_pin: z:P0.11
enable_pin: !z:P2.12
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: z:P1.4
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##########################################################################################################################################
# 	Extruder
##########################################################################################################################################

#	E0 on MCU X/Y
[extruder]
step_pin: toolhead:PD0
dir_pin: !toolhead:PD1
enable_pin: !toolhead:PD2
heater_pin: toolhead:PB13
sensor_pin: toolhead:PA4

##	Update value below when you perform extruder calibration
##	If you ask for 100mm of filament, but in reality it is 98mm: 19.81
##	rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
rotation_distance: 22.702389746561

gear_ratio: 50:10				#LDO Gear Ratio
microsteps: 32
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75

max_extrude_cross_section: 5
max_extrude_only_distance: 101

sensor_type:MAX31865
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2

min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 10


control: pid
pid_kp: 20.938
pid_ki: 1.662
pid_kd: 65.951

##	Try to keep pressure_advance below 1.0
pressure_advance: 0.02
##	Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: toolhead:PA15
run_current: 0.50
stealthchop_threshold: 0
#hold_current: 0.4
#sense_resistor: 0.110

##########################################################################################################################################
# 	Bed Heater
##########################################################################################################################################

[heater_bed]
##	SSR Pin - Z board, Fan Pin
heater_pin: z:P2.3
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: z:P0.25
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.65
min_temp: 0
max_temp: 115
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

##########################################################################################################################################
#   Chamber temperature
##########################################################################################################################################
[temperature_sensor chamber]
##	Validate the following thermistor type to make sure it is correct
sensor_type: ATC Semitec 104GT-2
sensor_pin: P0.24
min_temp: 10
max_temp: 270


##########################################################################################################################################
#   EBB temperature
##########################################################################################################################################
[temperature_sensor toolhead]
sensor_type: temperature_mcu
sensor_mcu: toolhead
min_temp: 0
max_temp: 85

[temperature_sensor carto]
sensor_type:   temperature_mcu
sensor_mcu:    cartographer
min_temp:                    5
max_temp:                  105


##########################################################################################################################################
#   Electronics
##########################################################################################################################################
[temperature_sensor raspi]
sensor_type: temperature_host
min_temp: 10
max_temp: 85

[temperature_sensor psu]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: z:P0.24
min_temp: 10
max_temp: 85

[temperature_sensor amb_electronics]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: z:P0.23
min_temp: 10
max_temp: 85

##########################################################################################################################################
# 	Fan Control
##########################################################################################################################################

[heater_fan hotend_fan]
##	Hotend Fan - XYE board, HE1 Connector
pin: toolhead:PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
shutdown_speed: 1.0
##	If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

[fan]
##	Print Cooling Fan - XYE board, Fan Pin
pin: toolhead:PA1
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
off_below: 0.10

[fan_generic rox]
##	Exhaust fan - Z board, HE0 Connector
pin: z:P2.7
max_power: 1.0
kick_start_time: 0.5
off_below: 1.0
#heater: heater_bed
#heater_temp: 60
#fan_speed: 0.8


[fan_generic nevermore_fan]
pin: z:P2.4
max_power: 1.0
kick_start_time: 0.5
off_below: 1.0
#heater: heater_bed
#heater_temp: 60
#fan_speed: 0.8

[fan_generic electronics]
pin: P2.3
max_power: 1.0
kick_start_time: 0.5
off_below: 0.3
#heater: heater_bed
#heater_temp: 60
#fan_speed: 0.8

##########################################################################################################################################
# 	Homing and Gantry Adjustment Routines
##########################################################################################################################################

[idle_timeout]
timeout: 3000
  
[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##	MAX (250, 250), (300,300), or (350,350) depending on your printer size
##	to respective belt positions

gantry_corners:
	-60,-10
	360,370
#	Probe points
points:
	50,25
	50,225
	250,225
	250,25

#--------------------------------------------------------------------
speed: 350
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075
max_adjust: 10


##########################################################################################################################################
#  G Sensor definition
##########################################################################################################################################
#adxl on EBB36

#[adxl345]
#cs_pin: toolhead:PB12
#spi_software_sclk_pin: toolhead:PB10
#spi_software_mosi_pin: toolhead:PB11
#spi_software_miso_pin: toolhead:PB2

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1
axes_map: x, z, -y #ADXL on EBB36
axes_map: x, -y, -z #ADXL on Cartographer Probe


[resonance_tester]
accel_chip: adxl345
probe_points:
    148, 152.5, 20

[input_shaper]
# Supported shapers: zv, mzv, zvd, ei, 2hump_ei, 3hump_ei
shaper_freq_x: 93.4
shaper_type_x: ei
damping_ratio_x: 0.038 # damping ratio for the X axis
shaper_freq_y: 42.0
shaper_type_y: mzv
damping_ratio_y: 0.117 # damping ratio for the Y axis


[bed_mesh]
#{% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %} 296
#{% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %} 305
  
zero_reference_position: 148, 152.5    
#    set this to the middle of your bed
speed: 350
#    movement speed of toolhead during bed mesh
horizontal_move_z: 3
#    height of scanner during bed mesh scan
mesh_min: 20, 21
#    start point of bed mesh [X, Y] - 10 / 0
mesh_max: 280, 260
#    end point of bed mesh [X, Y] - 280 / 260
probe_count: 20, 20
#bicubic_tension: 0.2
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough
#algorithm: bicubic

#[firmware_retraction]
#retract_length: 0.5
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
#retract_speed: 35
#   The speed of retraction, in mm/s. The default is 20 mm/s.
#unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
#unretract_speed: 25
#   The speed of unretraction, in mm/s. The default is 10 mm/s.


[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
keep_raw_data: True
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.


#End position (150.00, 240.00) is outside touch boundaries. Valid range: X=[20.00, 280.00], Y=[21.00, 239.00]

# https://docs.cartographer3d.com/cartographer-probe/features/axis-twist-compensation
[axis_twist_compensation]
speed: 50
#   The speed (in mm/s) of non-probing moves during the calibration.
#   The default is 50.
horizontal_move_z: 5
#   The height (in mm) that the head should be commanded to move to
#   just prior to starting a probe operation. The default is 5.
calibrate_start_x: 25
#   Defines the minimum X coordinate of the calibration
#   This should be the X coordinate that positions the nozzle at the starting
#   calibration position.
calibrate_end_x: 275
#   Defines the maximum X coordinate of the calibration
#   This should be the X coordinate that positions the nozzle at the ending
#   calibration position.
calibrate_y: 150
#   Defines the Y coordinate of the calibration
#   This should be the Y coordinate that positions the nozzle during the
#   calibration process. This parameter is recommended to
#   be near the center of the bed

# For Y-axis twist compensation, specify the following parameters:
calibrate_start_y: 25
#   Defines the minimum Y coordinate of the calibration
#   This should be the Y coordinate that positions the nozzle at the starting
#   calibration position for the Y axis. This parameter must be provided if
#   compensating for Y axis twist.
calibrate_end_y: 235
#   Defines the maximum Y coordinate of the calibration
#   This should be the Y coordinate that positions the nozzle at the ending
#   calibration position for the Y axis. This parameter must be provided if
#   compensating for Y axis twist.
calibrate_x: 150
#   Defines the X coordinate of the calibration for Y axis twist compensation
#   This should be the X coordinate that positions the nozzle during the
#   calibration process for Y axis twist compensation. This parameter must be
#   provided and is recommended to be near the center of the bed.


#[z_thermal_adjust]
#temp_coeff: 0.0113
#   The temperature coefficient of expansion, in mm/degC. For example, a
#   temp_coeff of 0.01 mm/degC will move the Z axis downwards by 0.01 mm for
#   every degree Celsius that the temperature sensor increases. Defaults to
#   0.0 mm/degC, which applies no adjustment.
#smooth_time:2
#   Smoothing window applied to the temperature sensor, in seconds. Can reduce
#   motor noise from excessive small corrections in response to sensor noise.
#   The default is 2.0 seconds.
#z_adjust_off_above:
#   Disables adjustments above this Z height [mm]. The last computed correction
#   will remain applied until the toolhead moves below the specified Z height
#   again. The default is 99999999.0 mm (always on).
#max_z_adjustment:
#   Maximum absolute adjustment that can be applied to the Z axis [mm]. The
#   default is 99999999.0 mm (unlimited).
#sensor_type: ATC Semitec 104GT-2
#sensor_pin: mcu:P0.24
#min_temp: 10
#max_temp: 270
#   Temperature sensor configuration.
#   See the "extruder" section for the definition of the above
#   parameters.
#gcode_id:
#   See the "heater_generic" section for the definition of this
#   parameter.


[safe_z_home]
home_xy_position: 148, 152.5
z_hop: 10

