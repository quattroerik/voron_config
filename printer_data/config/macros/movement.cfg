# ============================================================
# Shared XY router: obeys the two keep-outs
#   Pin:   X<3,  Y210-240  -> if X<10, clear in X before any Y move
#   Motor: X<20, Y>240     -> never enter; escape via Y240 first
# Destinations at X<20 with Y>240 are rejected.
# ============================================================
[gcode_macro _GD_ROUTE_XY]
description: Route XY to X,Y while avoiding the pin and purge-motor keep-outs
gcode:
  {% set x = params.X|float %}
  {% set y = params.Y|float %}
  {% set f = params.F|default(27000)|int %}

  {% set pin_clear_x = 10.0 %}   # below this, do an X move before any Y move
  {% set motor_x     = 20.0 %}   # actual motor keep-out boundary
  {% set safe_x      = 25.0 %}   # conservative travel corridor
  {% set prepare_x   = 100.0 %}   
  {% set limit_y     = 240.0 %}

  {% if x < motor_x and y > limit_y %}
    { action_raise_error(
        "GD ROUTE: target X%.1f Y%.1f is inside the purge motor keep-out (X<20, Y>240)"
        |format(x, y)
    ) }
  {% endif %}

  {% set cur_x = printer.gcode_move.gcode_position.x|float %}
  {% set cur_y = printer.gcode_move.gcode_position.y|float %}

  G90

  # Pin area: if X<10, clear in X before any Y move
  {% if cur_x < pin_clear_x %}
    G1 X{safe_x} F{f}
    {% set cur_x = safe_x %}
  {% endif %}

  {% if y > limit_y %}
    # Must be at X>=20 before crossing Y240 (use the X25 corridor)
    {% if cur_x < motor_x %}
      G1 X{prepare_x} F{f}
      {% set cur_x = prepare_x %}
    {% endif %}
    G1 Y{y} F{f}
    {% if (x - cur_x)|abs > 0.01 %}
      G1 X{x} F{f}
    {% endif %}
  {% else %}
    # At or below Y240: Y first, then X
    {% if (y - cur_y)|abs > 0.01 %}
      G1 Y{y} F{f}
    {% endif %}
    {% if (x - cur_x)|abs > 0.01 %}
      G1 X{x} F{f}
    {% endif %}
  {% endif %}


[gcode_macro _GD_PARK_MACRO]
gcode:
  {% set restore = params.RESTORE|default("0")|int %}
  {% set x = params.X|default("150")|float %}
  {% set y = params.Y|default("150")|float %}
  {% set z_hop = params.Z|default("5")|float %}
  {% set f = params.F|default("27000")|int %}

  # Validate first, before any motion (the router also checks)
  {% if x < 20.0 and y > 240.0 %}
    { action_raise_error(
        "GD PARK: unsafe target X%.1f Y%.1f. X must be >=20 when Y>240!"
        |format(x, y)
    ) }
  {% endif %}

  {% if restore == 1 %}

    # Z is still hopped, so route at hop height, then drop Z
    _GD_ROUTE_XY X={x} Y={y} F={f}

    # XY already equals the saved XY, so MOVE=1 only moves Z back.
    # (If X/Y passed here ever differ from the parked-from position,
    #  MOVE=1 would make a direct, unrouted move.)
    RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=1 MOVE_SPEED={f}

  {% else %}

    _CG28
    _CQGL

    SAVE_GCODE_STATE NAME=_GD_PARK_STATE
    G90

    {% if z_hop > 0 %}
      G91
      G1 Z{z_hop} F{f}
      G90
    {% endif %}

    _GD_ROUTE_XY X={x} Y={y} F={f}

    # Stay parked; restore modal state only
    RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=0

  {% endif %}


[gcode_macro _GD_MOVE_TO_OOZE_STOP]
gcode:
	{% set f = params.F|default("27000")|int %}
	# Over to ooze stop
    G1 X160 Y303 F{f}