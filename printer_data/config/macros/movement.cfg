
[gcode_macro _GD_PARK_MACRO]
gcode:
  {% set restore = params.RESTORE|default("0")|int %}
  {% set x = params.X|default("150")|float %}
  {% set y = params.Y|default("150")|float %}
  {% set z_hop = params.Z|default("5")|float %}
  {% set f = params.F|default("27000")|int %}

  # ============================================================
  # GEOMETRY
  # ============================================================
  {% set deadzone_x = 12.0 %}
  {% set safe_x = 25.0 %}
  {% set limit_y = 240.0 %}

  # ============================================================
  # RESTORE
  # ============================================================
  {% if restore == 1 %}

    {% set cur_x = printer.gcode_move.gcode_position.x|float %}
    {% set cur_y = printer.gcode_move.gcode_position.y|float %}

    # Reject an unsafe restore destination
    {% if x < safe_x and y > limit_y %}

      { action_raise_error(
          "GD PARK: unsafe restore target X%.1f Y%.1f. X must be >=25 when Y>240!"
          |format(x,y)
      ) }

    {% else %}

      G90

      # --------------------------------------------------------
      # Escape forbidden starting position
      # --------------------------------------------------------
      {% if cur_x < safe_x and cur_y > limit_y %}
        G1 Y{limit_y} F{f}
        {% set cur_y = limit_y %}
      {% endif %}

      # --------------------------------------------------------
      # Special dead zone: X<12
      # First move to X25.
      # --------------------------------------------------------
      {% if cur_x < deadzone_x %}
        G1 X{safe_x} F{f}
        {% set cur_x = safe_x %}
      {% endif %}

      # --------------------------------------------------------
      # If destination is above Y240, use X25 as corridor.
      # Never cross into X<25 while Y>240.
      # --------------------------------------------------------
      {% if y > limit_y %}

        {% if cur_x != safe_x %}
          G1 X{safe_x} F{f}
        {% endif %}

        G1 Y{y} F{f}

        {% if x != safe_x %}
          G1 X{x} F{f}
        {% endif %}

      {% else %}

        # Destination is at or below Y240.
        # Move Y first, then X.
        {% if cur_y != y %}
          G1 Y{y} F{f}
        {% endif %}

        {% if cur_x != x %}
          G1 X{x} F{f}
        {% endif %}

      {% endif %}

      # Restore saved G-code state and Z position.
      # XY is already at the original coordinates.
      RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=1 MOVE_SPEED={f}

    {% endif %}


  # ============================================================
  # PARK
  # ============================================================
  {% else %}

    # ----------------------------------------------------------
    # HOME / QGL
    # ----------------------------------------------------------
    _CG28
    _CQGL

    # ----------------------------------------------------------
    # Validate target BEFORE saving state
    # ----------------------------------------------------------
    {% if x < safe_x and y > limit_y %}

      { action_raise_error(
          "GD PARK: unsafe park target X%.1f Y%.1f. X must be >=25 when Y>240!"
          |format(x,y)
      ) }

    {% else %}

      # --------------------------------------------------------
      # Save original position and state
      # --------------------------------------------------------
      SAVE_GCODE_STATE NAME=_GD_PARK_STATE
      G90

      # --------------------------------------------------------
      # Current position
      # --------------------------------------------------------
      {% set cur_x = printer.gcode_move.gcode_position.x|float %}
      {% set cur_y = printer.gcode_move.gcode_position.y|float %}

      # --------------------------------------------------------
      # Relative Z hop
      # --------------------------------------------------------
      {% if z_hop > 0 %}
        G91
        G1 Z{z_hop} F{f}
        G90
      {% endif %}

      # --------------------------------------------------------
      # Escape forbidden starting position
      #
      # If X<25 and Y>240, move vertically to Y240 first.
      # --------------------------------------------------------
      {% if cur_x < safe_x and cur_y > limit_y %}
        G1 Y{limit_y} F{f}
        {% set cur_y = limit_y %}
      {% endif %}

      # --------------------------------------------------------
      # Special dead zone: X<12
      # First move to X25.
      # --------------------------------------------------------
      {% if cur_x < deadzone_x %}
        G1 X{safe_x} F{f}
        {% set cur_x = safe_x %}
      {% endif %}

      # --------------------------------------------------------
      # Route to parking position
      # --------------------------------------------------------
      {% if y > limit_y %}

        # Move to safe corridor before moving above Y240.
        {% if cur_x != safe_x %}
          G1 X{safe_x} F{f}
        {% endif %}

        # Move Y while safely at X25.
        G1 Y{y} F{f}

        # Move to final X.
        {% if x != safe_x %}
          G1 X{x} F{f}
        {% endif %}

      {% else %}

        # Destination is at or below Y240.
        # Y first, then X.
        {% if cur_y != y %}
          G1 Y{y} F{f}
        {% endif %}

        {% if cur_x != x %}
          G1 X{x} F{f}
        {% endif %}

      {% endif %}

      # --------------------------------------------------------
      # Keep parked. Do not restore original position.
      # --------------------------------------------------------
      RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=0

    {% endif %}

  {% endif %}

[gcode_macro _GD_MOVE_TO_OOZE_STOP]
gcode:
	{% set f = params.F|default("27000")|int %}
	# Over to ooze stop
    G1 X160 Y303 F{f}