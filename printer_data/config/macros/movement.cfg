[gcode_macro _GD_PARK_MACRO]
gcode:
  {% set restore = params.RESTORE|default("0")|int %}
  {% set x = params.X|default("150")|float %}
  {% set y = params.Y|default("150")|float %}
  {% set z_hop = params.Z|default("5")|float %}
  {% set f = params.F|default("27000")|int %}

  # ------------------------------------------------------------
  # RESTORE
  # ------------------------------------------------------------
  # Restore immediately.
  # Do NOT home, QGL or perform any other movement first.
  {% if restore == 1 %}

    RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=1 MOVE_SPEED={f}

  {% else %}

    # ----------------------------------------------------------
    # HOME / QGL
    # ----------------------------------------------------------
    _CG28
    _CQGL

    SAVE_GCODE_STATE NAME=_GD_PARK_STATE
    G90

    {% set cur_x = printer.gcode_move.gcode_position.x|float %}
    {% set cur_y = printer.gcode_move.gcode_position.y|float %}

    # ----------------------------------------------------------
    # RELATIVE Z HOP
    # ----------------------------------------------------------
    # Z is RELATIVE.
    # Example: Z=5 -> raise Z by 5 mm.
    #
    # The hop is always upward.
    {% if z_hop > 0 %}
      G91
      G1 Z{z_hop} F{f}
      G90
    {% endif %}

    # ----------------------------------------------------------
    # INITIAL XY ROUTING
    # ----------------------------------------------------------
    # Forbidden area during initial movement:
    #
    #       X < 120 AND Y > 270
    #
    # If we are currently left of X125 and the target Y is
    # above 270, first move to X125.
    #
    # X125 gives us 5 mm safety margin.
    {% if cur_x < 125 and y > 270 %}
      G1 X125 F{f}
    {% endif %}

    # ----------------------------------------------------------
    # MOVE TO TARGET Y
    # ----------------------------------------------------------
    G1 Y{y} F{f}

    # ----------------------------------------------------------
    # MOVE TO TARGET X
    # ----------------------------------------------------------
    G1 X{x} F{f}

    # ----------------------------------------------------------
    # KEEP PARKED
    # ----------------------------------------------------------
    RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=0

  {% endif %}