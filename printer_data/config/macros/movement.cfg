[gcode_macro _GD_PARK_MACRO]
gcode:
  {% set restore = params.RESTORE|default("0")|int %}
  {% set x = params.X|default("150")|float %}
  {% set y = params.Y|default("150")|float %}
  {% set z_hop = params.Z|default("5")|float %}
  {% set f = params.F|default("27000")|int %}

  {% set cur_x = printer.gcode_move.gcode_position.x|float %}
  {% set cur_y = printer.gcode_move.gcode_position.y|float %}
  {% set cur_z = printer.gcode_move.gcode_position.z|float %}

  # ------------------------------------------------------------
  # RESTORE
  # ------------------------------------------------------------
  # RESTORE=1 means:
  # restore the position saved by the previous parking operation.
  # Do nothing else.
  {% if restore == 1 %}

    RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=1 MOVE_SPEED={f}

  {% else %}

    # ----------------------------------------------------------
    # HOME / QGL
    # ----------------------------------------------------------
    _CG28
    _CQGL

    SAVE_GCODE_STATE NAME=_GD_PARK_STATE
    G90

    # ----------------------------------------------------------
    # RELATIVE Z HOP
    # ----------------------------------------------------------
    # Z is a relative movement.
    # Z=5 means raise the toolhead by 5 mm.
    {% if z_hop > 0 %}
      G91
      G1 Z{z_hop} F{f}
      G90
    {% endif %}

    # ----------------------------------------------------------
    # XY ROUTING
    # ----------------------------------------------------------
    #
    # FORBIDDEN AREA DURING INITIAL MOVEMENT:
    #
    #       X < 120
    #       Y > 270
    #
    # If the TARGET is inside this X/Y region, we MUST:
    #
    #   1. Move to X125
    #   2. Move to the target Y
    #   3. Move horizontally to the target X
    #
    # Example:
    #
    #   target X45 Y305
    #
    #   X30 Y200
    #       ↓
    #   X125 Y200
    #       ↓
    #   X125 Y305
    #       ↓
    #   X45 Y305
    #
    # X125 provides a 5 mm safety margin over X120.

    {% if cur_x < 120 and cur_y > 270 %}

      # Move outside the forbidden X range first.
      G1 X125 F{f}

      # Move to target Y while safely at X125.
      G1 Y{y} F{f}

      # Now move horizontally into the final position.
      G1 X{x} F{f}

    {% else %}

      # Target is not inside the forbidden area.
      G1 X{x} Y{y} F{f}


    {% endif %}

    # ----------------------------------------------------------
    # KEEP PARKED
    # ----------------------------------------------------------
    RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=0

  {% endif %}

[gcode_macro _GD_AFTER_PURGE]
gcode:
	{% set f = params.F|default("27000")|int %}
	# Over the brush away, then continue print
    G1 X125 F{f}