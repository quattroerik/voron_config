[gcode_macro _GD_PARK_MACRO]
description: Direct XY move; avoids the depressor pin and goose belt motor
variable_home_first: 0      # 1 = run _CG28/_CQGL before parking (off by default)
gcode:
  {% set x = params.X|default(-999)|float %}
  {% set y = params.Y|default(-999)|float %}
  {% set f = params.F|default(27000)|float %}

  {% set pin_x     = 10.0 %}    # pin zone: X<10, Y200-240
  {% set pin_y_lo  = 200.0 %}
  {% set pin_y_hi  = 240.0 %}
  {% set keepout_x = 30.0 %}    # motor keep-out: X<30 and Y>240
  {% set limit_y   = 240.0 %}
  {% set max_y     = 305.0 %}
  {% set pin_exit  = 25.0 %}

  {% if 'xy' not in printer.toolhead.homed_axes %}
    { action_respond_info("GD PARK: XY not homed, skipping move") }
  {% elif x == -999 and y == -999 %}
    # nothing to move
  {% else %}

    {% if printer["gcode_macro _GD_PARK_MACRO"].home_first|int == 1 %}
      _CG28
      _CQGL
    {% endif %}

    # Work in machine coordinates, emit moves in gcode coordinates
    {% set pos   = printer.gcode_move.gcode_position %}
    {% set raw   = printer.gcode_move.position %}
    {% set off_x = raw.x - pos.x %}
    {% set off_y = raw.y - pos.y %}

    {% set cx = pos.x + off_x %}
    {% set cy = pos.y + off_y %}
    {% set tx = cx if x == -999 else x + off_x %}
    {% set ty = cy if y == -999 else y + off_y %}

    {% if ty > max_y %}
      { action_raise_error("GD PARK: Y%.1f exceeds %.1f"|format(ty, max_y)) }
    {% endif %}
    {% if tx < keepout_x and ty > limit_y %}
      { action_raise_error("GD PARK: target X%.1f Y%.1f is in the motor keep-out (X<25, Y>240)"|format(tx, ty)) }
    {% endif %}
    {% if cx < keepout_x and cy > limit_y %}
      { action_raise_error("GD PARK: toolhead is inside the motor keep-out (X%.1f Y%.1f). Move it out manually."|format(cx, cy)) }
    {% endif %}

    G90

    # Pin: at X<10, move out in X before any move that touches the pin band
    {% set y_lo = [cy, ty]|min %}
    {% set y_hi = [cy, ty]|max %}
    {% if cx < pin_x and y_hi >= pin_y_lo and y_lo <= pin_y_hi %}
      _SAFE_G1 X={pin_exit - off_x} F={f}
      {% set cx = pin_exit %}
    {% endif %}

    # Keep-out guard: a straight line must not cut through X<30, Y>240.
    # Both endpoints are outside the zone here, but the line between them
    # could still cross it, so split the move only in those cases.
    {% if cx < keepout_x and ty > limit_y %}
      # Start left of the zone, target behind it: get to X30 first
      _SAFE_G1 X={keepout_x - off_x} F={f}
      {% set cx = keepout_x %}
    {% elif cy > limit_y and tx < keepout_x %}
      # Start behind the zone at X>=25, target left of it: drop to Y240 first
      _SAFE_G1 Y={limit_y - off_y} F={f}
      {% set cy = limit_y %}
    {% endif %}

    # Direct move to the target
    {% if (tx - cx)|abs > 0.01 or (ty - cy)|abs > 0.01 %}
      _SAFE_G1 X={tx - off_x} Y={ty - off_y} F={f}
    {% endif %}

  {% endif %}

[gcode_macro _GD_MOVE_TO_BELT_PURGER]
gcode:
	{% set f = params.F|default("27000")|int %}
	{% set STAGE0_Y = 300 %}
    {% set STAGE0_X = 100 %}
	
	#Move to STAGE0
    _GD_PARK_MACRO X={STAGE0_X} Y={STAGE0_Y} F={f}
	

[gcode_macro _GD_MOVE_TO_OOZE_STOP]
gcode:
	{% set f = params.F|default("27000")|int %}
	{% set OOZE_STOP_Y = 300 %}
    {% set OOZE_STOP_X = 160 %}
	# Over to ooze stop
    _GD_PARK_MACRO X={OOZE_STOP_X} Y={OOZE_STOP_Y} F={f}