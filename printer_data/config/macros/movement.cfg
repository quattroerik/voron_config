[gcode_macro _GD_PARK_MACRO]
gcode:
  {% set restore = params.RESTORE|default("0")|int %}
  {% set x = params.X|default("150")|float %}
  {% set y = params.Y|default("150")|float %}
  {% set z_hop = params.Z|default("5")|float %}
  {% set f = params.F|default("27000")|int %}

  # ============================================================
  # GEOMETRY
  # ============================================================
  #
  # Physical brush:
  #   X = 65 ... 105
  #   Y = 303 ... 305
  #
  # Cartographer is up to 35 mm BEHIND nozzle (+Y).
  #
  # Therefore the nozzle must not pass through:
  #
  #   X = 65 ... 105
  #   Y = 268 ... 270
  #
  # 2 mm safety margin added:
  #
  #   NOZZLE KEEP-OUT:
  #   X = 63 ... 107
  #   Y = 266 ... 272
  #
  # X125 is our safe corridor to the right of the brush.
  #
  # ============================================================

  {% set keepout_x_min = 63.0 %}
  {% set keepout_x_max = 107.0 %}
  {% set keepout_y_min = 266.0 %}
  {% set keepout_y_max = 272.0 %}
  {% set safe_x = 125.0 %}

  # ============================================================
  # RESTORE
  # ============================================================
  #
  # Happy Hare supplies the ORIGINAL X/Y as parameters when
  # RESTORE=1 is called.
  #
  # We MUST route to those coordinates ourselves.
  #
  {% if restore == 1 %}

    # ------------------------------------------
    # A restore target inside the keep-out zone
    # is fundamentally unsafe because the probe
    # would end up over the brush.
    # ------------------------------------------
    {% if
      x >= keepout_x_min and
      x <= keepout_x_max and
      y >= keepout_y_min and
      y <= keepout_y_max
    %}

      { action_raise_error(
          "GD PARK: restore position X%.1f Y%.1f would place Cartographer over brush!"
          |format(x, y)
      ) }

    {% else %}

      # Current physical position
      {% set cur_x = printer.gcode_move.gcode_position.x|float %}
      {% set cur_y = printer.gcode_move.gcode_position.y|float %}

      G90

      # ------------------------------------------
      # If current position is already inside the
      # keep-out zone, do NOT try to move through
      # the brush to escape it.
      # ------------------------------------------
      {% if
        cur_x >= keepout_x_min and
        cur_x <= keepout_x_max and
        cur_y >= keepout_y_min and
        cur_y <= keepout_y_max
      %}

        { action_raise_error(
            "GD PARK: current position X%.1f Y%.1f is inside Cartographer brush keep-out!"
            |format(cur_x, cur_y)
        ) }

      {% else %}

        # ----------------------------------------
        # Determine safe Y for crossing the brush
        # X range.
        #
        # If target Y is already safely above/below
        # the keep-out, use target Y directly.
        #
        # If target Y is inside the keep-out band,
        # use Y274 first, then approach target Y
        # from the safe X position.
        # ----------------------------------------
        {% if y >= keepout_y_min and y <= keepout_y_max %}
          {% set safe_y = keepout_y_max + 2.0 %}
        {% else %}
          {% set safe_y = y %}
        {% endif %}

        # ----------------------------------------
        # If current Y is inside the keep-out band
        # and current X is on the LEFT side, first
        # move vertically out of the keep-out Y band.
        #
        # This avoids moving horizontally across the
        # brush while the probe is at brush height.
        # ----------------------------------------
        {% if
          cur_y >= keepout_y_min and
          cur_y <= keepout_y_max and
          cur_x < keepout_x_min
        %}

          G1 Y{safe_y} F{f}

        {% endif %}

        # ----------------------------------------
        # Move to safe X corridor.
        # At this point we are guaranteed not to
        # cross the brush keep-out horizontally.
        # ----------------------------------------
        {% if cur_x != safe_x %}
          G1 X{safe_x} F{f}
        {% endif %}

        # ----------------------------------------
        # Move to safe Y.
        # ----------------------------------------
        {% if safe_y != y %}
          G1 Y{safe_y} F{f}
        {% endif %}

        # ----------------------------------------
        # Move horizontally to target X while the
        # probe is safely away from the brush.
        # ----------------------------------------
        {% if x != safe_x %}
          G1 X{x} F{f}
        {% endif %}

        # ----------------------------------------
        # If target Y was inside the keep-out band,
        # approach it vertically from the target X.
        #
        # Target X is guaranteed to be outside the
        # keep-out zone by the check above.
        # ----------------------------------------
        {% if safe_y != y %}
          G1 Y{y} F{f}
        {% endif %}

        # ----------------------------------------
        # Now the physical toolhead is already at
        # the saved X/Y position.
        #
        # Restore the saved G-code state including Z.
        #
        # MOVE=1 is safe here because XY is already
        # exactly at the requested restore position,
        # so it cannot make an additional XY travel.
        # ----------------------------------------
        RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=1 MOVE_SPEED={f}

      {% endif %}
    {% endif %}


  # ============================================================
  # PARK
  # ============================================================
  {% else %}

    # ----------------------------------------------------------
    # HOME / QGL
    # ----------------------------------------------------------
    _CG28
    _CQGL

    # ----------------------------------------------------------
    # Save the original position/state BEFORE parking.
    # ----------------------------------------------------------
    SAVE_GCODE_STATE NAME=_GD_PARK_STATE
    G90

    # ----------------------------------------------------------
    # Current position
    # ----------------------------------------------------------
    {% set cur_x = printer.gcode_move.gcode_position.x|float %}
    {% set cur_y = printer.gcode_move.gcode_position.y|float %}

    # ----------------------------------------------------------
    # Target position itself must not put the probe over
    # the brush.
    # ----------------------------------------------------------
    {% if
      x >= keepout_x_min and
      x <= keepout_x_max and
      y >= keepout_y_min and
      y <= keepout_y_max
    %}

      { action_raise_error(
          "GD PARK: target X%.1f Y%.1f would place Cartographer over brush!"
          |format(x, y)
      ) }

    {% endif %}

    # ----------------------------------------------------------
    # Relative Z hop
    # ----------------------------------------------------------
    {% if z_hop > 0 %}
      G91
      G1 Z{z_hop} F{f}
      G90
    {% endif %}

    # ----------------------------------------------------------
    # Determine safe Y.
    #
    # Normally we can use the target Y directly.
    #
    # If target Y is inside the nozzle keep-out zone,
    # first move above it to Y274.
    # ----------------------------------------------------------
    {% if y >= keepout_y_min and y <= keepout_y_max %}
      {% set safe_y = keepout_y_max + 2.0 %}
    {% else %}
      {% set safe_y = y %}
    {% endif %}

    # ----------------------------------------------------------
    # If we start LEFT of the brush while the nozzle is
    # at brush height, move vertically out first.
    #
    # Otherwise moving X125 first could sweep the probe
    # across the brush.
    # ----------------------------------------------------------
    {% if
      cur_y >= keepout_y_min and
      cur_y <= keepout_y_max and
      cur_x < keepout_x_min
    %}

      G1 Y{safe_y} F{f}

    {% endif %}

    # ----------------------------------------------------------
    # Safe X corridor
    # ----------------------------------------------------------
    G1 X{safe_x} F{f}

    # ----------------------------------------------------------
    # Move in Y while X125 is safely to the right
    # of the brush.
    # ----------------------------------------------------------
    G1 Y{safe_y} F{f}

    # ----------------------------------------------------------
    # Move horizontally to target X.
    #
    # Probe is now safely away from the brush in Y.
    # ----------------------------------------------------------
    G1 X{x} F{f}

    # ----------------------------------------------------------
    # If target Y was inside the nozzle keep-out band,
    # move vertically to it only after reaching target X.
    #
    # Target X is outside the keep-out zone.
    # ----------------------------------------------------------
    {% if safe_y != y %}
      G1 Y{y} F{f}
    {% endif %}

    # ----------------------------------------------------------
    # Keep parked.
    # Restore only the G-code state, NOT the position.
    # ----------------------------------------------------------
    RESTORE_GCODE_STATE NAME=_GD_PARK_STATE MOVE=0

  {% endif %}


[gcode_macro _GD_AFTER_PURGE]
gcode:
	{% set f = params.F|default("27000")|int %}
	# Over the brush away, then continue print
    G1 X125 F{f}