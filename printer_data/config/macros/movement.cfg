[gcode_macro _MY_PARK_MACRO]
description: Direct XY move; avoids the depressor pin
variable_home_first: 0      # 1 = run _CG28/_CQGL before parking (off by default)
gcode:
  {% set x = params.X|default(-999)|float %}
  {% set y = params.Y|default(-999)|float %}
  {% set f = params.F|default(27000)|float %}

  {% set pin_x      = 3.0 %}     # pin zone: X<3, Y200-240
  {% set pin_y_lo   = 200.0 %}
  {% set pin_y_hi   = 240.0 %}
  {% set corridor_x = 30.0 %}    # safe X column used to get around the pin
  {% set max_y      = 305.0 %}

  {% if 'xy' not in printer.toolhead.homed_axes %}
    { action_respond_info("GD PARK: XY not homed, skipping move") }
  {% elif x == -999 and y == -999 %}
    # nothing to move
  {% else %}

    {% if printer["gcode_macro _MY_PARK_MACRO"].home_first|int == 1 %}
      _CG28
      _CQGL
    {% endif %}

    # Work in machine coordinates, emit moves in gcode coordinates
    {% set pos   = printer.gcode_move.gcode_position %}
    {% set raw   = printer.gcode_move.position %}
    {% set off_x = raw.x - pos.x %}
    {% set off_y = raw.y - pos.y %}

    {% set cx = pos.x + off_x %}
    {% set cy = pos.y + off_y %}
    {% set tx = cx if x == -999 else x + off_x %}
    {% set ty = cy if y == -999 else y + off_y %}

    {% if ty > max_y %}
      { action_raise_error("GD PARK: Y%.1f exceeds %.1f"|format(ty, max_y)) }
    {% endif %}
    {% if tx < pin_x and ty >= pin_y_lo and ty <= pin_y_hi %}
      { action_raise_error("GD PARK: target X%.1f Y%.1f is in the pin zone (X<3, Y200-240)"|format(tx, ty)) }
    {% endif %}
    {% if cx < pin_x and cy >= pin_y_lo and cy <= pin_y_hi %}
      { action_raise_error("GD PARK: toolhead is inside the pin zone (X%.1f Y%.1f). Move it out manually."|format(cx, cy)) }
    {% endif %}

    G90

    # Does the move touch the pin band while at X<3?
    {% set y_lo = [cy, ty]|min %}
    {% set y_hi = [cy, ty]|max %}
    {% if [cx, tx]|min < pin_x and y_hi >= pin_y_lo and y_lo <= pin_y_hi %}
      # Detour: leave X<3 (we are outside the Y band here), travel in Y along
      # the X30 corridor to the target Y (e.g. Y>300 for a park position),
      # then do the final X move below.
      {% if cx < pin_x %}
        _SAFE_G1 X={corridor_x - off_x} F={f}
        {% set cx = corridor_x %}
      {% endif %}
      {% if (ty - cy)|abs > 0.01 %}
        _SAFE_G1 Y={ty - off_y} F={f}
        {% set cy = ty %}
      {% endif %}
    {% endif %}

    # Direct move to the target (after a detour this is only the final X move)
    {% if (tx - cx)|abs > 0.01 or (ty - cy)|abs > 0.01 %}
      _SAFE_G1 X={tx - off_x} Y={ty - off_y} F={f}
    {% endif %}

  {% endif %}


[gcode_macro _MOVE_TO_OOZE_STOP]
gcode:
	{% set f = params.F|default("27000")|int %}
	{% set OOZE_STOP_Y = 301.5 %}
    {% set OOZE_STOP_X = 91 %}
	# Over to ooze stop
    _GD_PARK_MACRO X={OOZE_STOP_X} Y={OOZE_STOP_Y} F={f}